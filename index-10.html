<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <div class="calculator-header">
            <span class="brand">CALCULATOR</span>
            <span class="status-dots"><i></i><i></i><i></i></span>
        </div>

        <div class="display">
            <div class="display-expression">WELCOME</div>
            <div class="display-value">0</div>
        </div>

        <div class="buttons">
            <button class="function">AC</button>
            <button class="function">C</button>
            <button class="function">%</button>
            <button class="operator">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>

            <button class="zero">0</button>
            <button>.</button>
            <button class="equals">=</button>
        </div>
        <div class="calculator-footer">SIMPLE • CLEAN • CLASSIC</div>
    </main>
</body>
</html>
